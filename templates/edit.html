{% extends "base.html" %}
{% block title %}Edit Note{% endblock %}
{% block content %}
<section class="card">
    <h2>Edit Note</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form action="{{ url_for('edit_note', note_id=note['id']) }}" method="POST">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="100" value="{{ note['title'] }}" required>

        <label for="content">Content</label>
        <textarea id="content" name="content" rows="6" required>{{ note['content'] }}</textarea>

        <div class="actions">
            <button type="submit" class="btn">Update</button>
            <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
